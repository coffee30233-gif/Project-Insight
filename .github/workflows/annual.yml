name: Annual Report

on:
  schedule:
    - cron: '30 1 2 1 *'   # 每年 1 月 2 號 09:30 台北時間，處理「去年」
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: projector-insight-pipeline
  cancel-in-progress: false

jobs:
  annual-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 產生年報（預設處理「去年」，讀取該年 1-12 月的月報彙整）
        id: report
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_annual_report.py

      - name: 算出年報檔名
        id: filename
        run: |
          REPORT_FILE=$(python -c "from datetime import date; print(f'{date.today().year - 1}-annual.md')")
          echo "報告檔名：$REPORT_FILE"
          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

      - name: 產生簡報
        id: slides
        if: always()
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          REPORT_FILE="${{ steps.filename.outputs.report_file }}"
          if [ -f "reports/$REPORT_FILE" ]; then
            python generate_slides.py "reports/$REPORT_FILE"
          else
            echo "找不到 reports/$REPORT_FILE"
            exit 1
          fi

      - name: 匯出靜態資料
        id: export
        if: always()
        continue-on-error: true
        run: python export_static_data.py

      - name: git commit + push（data/ 和 reports/）
        id: commit
        if: always()
        continue-on-error: true
        run: |
          git config user.name "projector-insight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "沒有新變更，略過 commit / push"
          else
            git commit -m "Annual report ${{ steps.filename.outputs.report_file }}（GitHub Actions）"
            git push origin HEAD:main
          fi

      - name: 判斷整體成功/失敗
        id: status
        if: always()
        run: |
          if [ "${{ steps.report.outcome }}" = "failure" ] || \
             [ "${{ steps.slides.outcome }}" = "failure" ] || \
             [ "${{ steps.export.outcome }}" = "failure" ] || \
             [ "${{ steps.commit.outcome }}" = "failure" ]; then
            echo "result=failed" >> "$GITHUB_OUTPUT"
          else
            echo "result=success" >> "$GITHUB_OUTPUT"
          fi

      - name: 通知 n8n（沒設 N8N_WEBHOOK_ANNUAL 就靜靜略過）
        if: always()
        env:
          N8N_WEBHOOK_ANNUAL: ${{ secrets.N8N_WEBHOOK_ANNUAL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
        run: |
          echo "GitHub Actions annual run：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            | python notify_n8n.py annual ${{ steps.status.outputs.result }}

      - name: 有步驟失敗就讓這次 workflow 顯示失敗
        if: steps.status.outputs.result == 'failed'
        run: exit 1

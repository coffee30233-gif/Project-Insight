name: Monthly Report

on:
  schedule:
    - cron: '30 1 1 * *'   # 每月 1 號 09:30 台北時間（UTC+8）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: projector-insight-pipeline
  cancel-in-progress: false

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore projector_intel.db（來自 tmp/db-transfer 分支）
        run: python backup_db.py restore

      - name: 產生月報（預設處理「上個月」）
        id: report
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_monthly_report.py

      - name: 算出上個月報告的檔名
        id: filename
        run: |
          REPORT_FILE=$(python -c "from datetime import date; d=date.today(); y=d.year-(1 if d.month==1 else 0); m=12 if d.month==1 else d.month-1; print(f'{y}-{m:02d}.md')")
          echo "報告檔名：$REPORT_FILE"
          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"

      - name: 產生簡報
        id: slides
        if: always()
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          REPORT_FILE="${{ steps.filename.outputs.report_file }}"
          if [ -f "reports/$REPORT_FILE" ]; then
            python generate_slides.py "reports/$REPORT_FILE"
          else
            echo "找不到 reports/$REPORT_FILE，可能上個月沒有任何已處理的文章，略過產生簡報"
            exit 1
          fi

      - name: 匯出靜態資料
        id: export
        if: always()
        continue-on-error: true
        run: python export_static_data.py

      - name: git commit + push（data/ 和 reports/）
        id: commit
        if: always()
        continue-on-error: true
        run: |
          git config user.name "projector-insight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "沒有新變更，略過 commit / push"
          else
            git commit -m "Monthly report ${{ steps.filename.outputs.report_file }}（GitHub Actions）"
            git push origin HEAD:main
          fi

      - name: 把資料庫狀態存回 tmp/db-transfer 分支
        if: always()
        continue-on-error: true
        run: python backup_db.py

      - name: 判斷整體成功/失敗
        id: status
        if: always()
        run: |
          if [ "${{ steps.report.outcome }}" = "failure" ] || \
             [ "${{ steps.slides.outcome }}" = "failure" ] || \
             [ "${{ steps.export.outcome }}" = "failure" ] || \
             [ "${{ steps.commit.outcome }}" = "failure" ]; then
            echo "result=failed" >> "$GITHUB_OUTPUT"
          else
            echo "result=success" >> "$GITHUB_OUTPUT"
          fi

      - name: 通知 n8n
        if: always()
        env:
          N8N_WEBHOOK_MONTHLY: ${{ secrets.N8N_WEBHOOK_MONTHLY }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
        run: |
          echo "GitHub Actions monthly run：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            | python notify_n8n.py monthly ${{ steps.status.outputs.result }}

      - name: 有步驟失敗就讓這次 workflow 顯示失敗
        if: steps.status.outputs.result == 'failed'
        run: exit 1

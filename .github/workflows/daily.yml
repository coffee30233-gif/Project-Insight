name: Daily Update

on:
  schedule:
    - cron: '30 0 * * *'   # 08:30 台北時間（UTC+8）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: projector-insight-pipeline
  cancel-in-progress: false

jobs:
  daily-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore projector_intel.db（來自 tmp/db-transfer 分支）
        run: python backup_db.py restore

      - name: 跑爬蟲
        id: scraper
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper_example.py

      - name: 每季原文連結健檢（1/4/7/10 月 1 號）
        id: linkcheck
        if: always()
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          IS_Q=$(python -c "from datetime import date; d=date.today(); print(1 if (d.day==1 and d.month in (1,4,7,10)) else 0)")
          if [ "$IS_Q" = "1" ]; then
            python check_links.py
          else
            echo "非季初，略過"
          fi

      - name: 匯出靜態資料
        id: export
        if: always()
        continue-on-error: true
        run: python export_static_data.py

      - name: git commit + push（data/）
        id: commit
        if: always()
        continue-on-error: true
        run: |
          git config user.name "projector-insight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "今天沒有新變更，略過 commit / push"
          else
            git commit -m "Daily update $(date +%F)（GitHub Actions）"
            git push origin HEAD:main
          fi

      - name: 把資料庫狀態存回 tmp/db-transfer 分支
        if: always()
        continue-on-error: true
        run: python backup_db.py

      - name: 判斷整體成功/失敗
        id: status
        if: always()
        run: |
          if [ "${{ steps.scraper.outcome }}" = "failure" ] || \
             [ "${{ steps.linkcheck.outcome }}" = "failure" ] || \
             [ "${{ steps.export.outcome }}" = "failure" ] || \
             [ "${{ steps.commit.outcome }}" = "failure" ]; then
            echo "result=failed" >> "$GITHUB_OUTPUT"
          else
            echo "result=success" >> "$GITHUB_OUTPUT"
          fi

      - name: 通知 n8n
        if: always()
        env:
          N8N_WEBHOOK_DAILY: ${{ secrets.N8N_WEBHOOK_DAILY }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
        run: |
          echo "GitHub Actions daily run：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            | python notify_n8n.py daily ${{ steps.status.outputs.result }}

      - name: 有步驟失敗就讓這次 workflow 顯示失敗
        if: steps.status.outputs.result == 'failed'
        run: exit 1
